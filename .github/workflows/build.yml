name: Build

on:
  push:
  pull_request:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test CodexQuotaBar.sln
      - run: dotnet publish src/CodexQuotaBar/CodexQuotaBar.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaBar-win-x64
          path: src/CodexQuotaBar/bin/Release/net8.0-windows/win-x64/publish/CodexQuotaBar.exe
